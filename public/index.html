<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyería Dala - Autenticación</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 380px; text-align: center; }
    .card h1 { font-size: 24px; color: #1a252f; margin-bottom: 4px; }
    .card h2 { font-size: 11px; color: #d4af37; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 20px; }
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; cursor: pointer; font-weight: 600; color: #7f8c8d; }
    .tab.active { color: #d4af37; border-bottom: 3px solid #d4af37; margin-bottom: -2px; }
    .form-group { text-align: left; margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; color: #333; margin-bottom: 5px; font-weight: 500; }
    .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; }
    .form-group input:focus { border-color: #d4af37; }
    .btn { width: 100%; padding: 12px; background: #222d32; color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    .btn:hover { background: #1a2226; }
    .alert { padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; display: none; }
    .alert-danger { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    .alert-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Joyería Dala</h1>
    <h2>Servicio Web de Autenticación</h2>

    <div class="tabs">
      <div class="tab" id="tab-login" onclick="mostrarFormulario('login')">Iniciar Sesión</div>
      <div class="tab active" id="tab-register" onclick="mostrarFormulario('register')">Registrarse</div>
    </div>

    <div id="alert" class="alert"></div>

    <!-- Formulario de Registro -->
    <form id="form-register" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="reg-nombre">Nombre Completo:</label>
        <input type="text" id="reg-nombre" required>
      </div>
      <div class="form-group">
        <label for="reg-email">Correo Electrónico:</label>
        <input type="email" id="reg-email" required>
      </div>
      <div class="form-group">
        <label for="reg-password">Contraseña:</label>
        <input type="password" id="reg-password" required>
      </div>
      <button type="submit" class="btn">Crear Cuenta</button>
    </form>

    <!-- Formulario de Login -->
    <form id="form-login" onsubmit="handleLogin(event)" style="display: none;">
      <div class="form-group">
        <label for="login-email">Correo Electrónico:</label>
        <input type="email" id="login-email" required>
      </div>
      <div class="form-group">
        <label for="login-password">Contraseña:</label>
        <input type="password" id="login-password" required>
      </div>
      <button type="submit" class="btn">Iniciar Sesión</button>
    </form>
  </div>

  <script>
    function mostrarFormulario(tipo) {
      document.getElementById('alert').style.display = 'none';
      if (tipo === 'register') {
        document.getElementById('form-register').style.display = 'block';
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
      } else {
        document.getElementById('form-register').style.display = 'none';
        document.getElementById('form-login').style.display = 'block';
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
      }
    }

    function mostrarAlerta(mensaje, esError = true) {
      const alertDiv = document.getElementById('alert');
      alertDiv.innerText = mensaje;
      alertDiv.className = esError ? 'alert alert-danger' : 'alert alert-success';
      alertDiv.style.display = 'block';
    }

    async function handleRegister(e) {
      e.preventDefault();
      const nombre = document.getElementById('reg-nombre').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nombre, email, password })
        });

        const data = await response.json();

        if (response.ok && data.exito) {
          mostrarAlerta(data.mensaje, false);
          document.getElementById('form-register').reset();
        } else {
          mostrarAlerta(data.mensaje || 'Error al registrar el usuario.');
        }
      } catch (err) {
        mostrarAlerta('Error al conectar con el servidor.');
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok && data.exito) {
          mostrarAlerta(`Bienvenido/a, ${data.usuario.nombre}!`, false);
          document.getElementById('form-login').reset();
        } else {
          mostrarAlerta(data.mensaje || 'Credenciales incorrectas.');
        }
      } catch (err) {
        mostrarAlerta('Error al conectar con el servidor.');
      }
    }
  </script>
</body>
</html>
